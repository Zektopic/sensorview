[package]
name = "sensorview"
version = "0.1.0"
description = "SensorView — a HWiNFO-style native hardware monitor"
authors = ["SensorView contributors"]
edition = "2021"
# Was "1.77", which was stale (egui 0.35 already needed more) and silently
# downgraded new deps during resolution — cargo honors rust-version when
# picking versions, so egui_tiles resolved to 0.10 (egui 0.30) instead of 0.16.
rust-version = "1.92"

[dependencies]
# "rc" is required: TelemetryFrame holds `Arc<Inventory>` (state.rs), and
# `Arc<T>: Serialize` only exists behind that feature. It used to be enabled
# transitively by a GUI crate, so making the GUI optional broke serialization
# in headless builds — hence enabling it explicitly here.
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
dirs = "6"

# --- GUI (optional: `--no-default-features --features cli` drops all of it) --
eframe = { version = "0.35", optional = true }
egui_extras = { version = "0.35", optional = true }
egui_tiles = { version = "0.16", features = ["serde"], optional = true }
# Only used to decode the embedded window icon.
image = { version = "0.25", default-features = false, features = ["png"], optional = true }
# Lock-free publish/subscribe of the latest telemetry frame (see src/state.rs).
arc-swap = "1.9"

# --- Thread 3: embedded web server (optional, on by default) ---------------
axum = { version = "0.8", features = ["ws"], optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "net", "time", "macros"], optional = true }
tower-http = { version = "0.6", features = ["compression-gzip", "set-header"], optional = true }
rust-embed = { version = "8", optional = true }
mime_guess = { version = "2", optional = true }
rand = { version = "0.9", optional = true }
# Only for StreamExt/SinkExt when splitting a WebSocket into read + write
# halves — tokio::select! can't borrow the socket mutably twice.
futures-util = { version = "0.3", default-features = false, optional = true }
clap = { version = "4.6.4", features = ["derive"] }
ctrlc = "3.5.2"
ureq = { version = "3.3.0", default-features = false, optional = true }

[target.'cfg(windows)'.dependencies]
wmi = "0.18"

# --- macOS (Apple Silicon) native backend ----------------------------------
# IOKit itself is hand-declared (`#[link(name = "IOKit", kind = "framework")]`,
# see src/source/macos/iokit.rs) to match the extern-block style used for
# advapi32/kernel32 elsewhere. CoreFoundation is the exception: IOKit returns
# CFDictionary/CFArray/CFNumber trees, and hand-rolling retain/release around
# those is where that idiom stops paying for itself.
[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-foundation-sys = "0.8"
# sysctlbyname, dlopen/dlsym (libIOReport is not on disk — see ioreport.rs),
# geteuid.
libc = "0.2"
# host_processor_info / host_statistics64 for per-core load and memory.
mach2 = "0.4"

[features]
default = ["gui", "web", "push"]

# The native window. Dropping it yields a headless binary for servers and
# containers that never links the windowing stack.
gui = ["dep:eframe", "dep:egui_extras", "dep:egui_tiles", "dep:image"]
# Push telemetry to an external collector (InfluxDB line protocol, JSON webhook).
push = ["dep:ureq"]
# The LAN dashboard tier. Compiling without it drops tokio/axum entirely and
# yields a pure-GUI binary.
web = [
    "dep:axum",
    "dep:tokio",
    "dep:tower-http",
    "dep:rust-embed",
    "dep:mime_guess",
    "dep:rand",
    "dep:futures-util",
]
ureq = ["dep:ureq"]

# build.rs only ever touches Windows resources, so don't make Linux/macOS
# builds compile winresource to reach a branch that is `if false` for them.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

# cargo-packager configuration (NSIS .exe / .deb / .dmg) — used by CI.
[package.metadata.packager]
product-name = "SensorView"
identifier = "com.sensorview.desktop"
category = "Utility"
# Every PNG here is converted into one .icns entry for the macOS .app bundle,
# via `IconType::from_pixel_size_and_density(w, h, density)`. Density is 2 only
# when the filename contains "@2x". There is no 1024×1024 entry at 1x density —
# 1024 px is only legal as 512@2x — so a plain 1024 `icon.png` made the macOS
# job fail with "No matching IconType". Sizes here are checked by
# `icon_assets_map_to_valid_icns_types` so that can't regress unnoticed on a
# platform we don't build locally.
icons = [
    "assets/32x32.png",
    "assets/128x128.png",
    "assets/256x256.png",
    "assets/512x512.png",
    "assets/icon@2x.png",
    "assets/icon.ico",
]
# Ship the LibreHardwareMonitor sidecar next to the app. `resources` is a
# top-level field; the glob resolves to nothing on non-Windows runners (where
# the .NET win-x64 sidecar isn't published), so it's harmless there.
resources = ["sidecar/publish/*.exe"]
